name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # enablement turns Pages on if it has never been enabled for the repo,
      # instead of failing with "Get Pages site failed".
      - uses: actions/configure-pages@v5
        id: pages
        with:
          enablement: true

      # Regenerates index.html and s/<slug>/index.html from data/library.json.
      # No dependencies to install — the generator is plain Node.
      # Absolute URLs come from the CNAME file; GW_SITE_URL is only the
      # fallback for a deploy with no custom domain.
      - name: Build
        run: node tools/build.mjs
        env:
          GW_SITE_URL: ${{ steps.pages.outputs.base_url }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
